# Local development only. Credentials below are throwaway.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sealbox
      POSTGRES_PASSWORD: sealbox
      POSTGRES_DB: sealbox
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  sealbox:
    build: .
    environment:
      SEALBOX_MASTER_KEY: ${SEALBOX_MASTER_KEY:?set it in .env, see .env.example}
      SEALBOX_API_KEY: ${SEALBOX_API_KEY:?set it in .env, see .env.example}
      SEALBOX_DATABASE_URL: postgres://sealbox:sealbox@postgres:5432/sealbox?sslmode=disable
      # Dev only: plaintext HTTP inside the compose network. Production needs SEALBOX_TLS_CERT/KEY.
      SEALBOX_INSECURE_HTTP: "1"
      SEALBOX_SCHEMA: /etc/sealbox/schema.json
    volumes: ["./schema.example.json:/etc/sealbox/schema.json:ro"]
    ports: ["8080:8080"]
    depends_on: [postgres]

volumes:
  pgdata:
