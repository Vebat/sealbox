name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sealbox
          POSTGRES_PASSWORD: sealbox
          POSTGRES_DB: sealbox
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SEALBOX_TEST_DATABASE_URL: postgres://sealbox:sealbox@localhost:5432/sealbox?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: AWS KMS build tag
        run: |
          go vet -tags awskms ./...
          go test -race -tags awskms ./internal/envelope/
          go build -tags awskms ./cmd/sealbox
      - name: dependency licenses
        run: GOFLAGS=-tags=awskms go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,ISC
      - name: container image builds
        run: docker build -t sealbox:ci .
